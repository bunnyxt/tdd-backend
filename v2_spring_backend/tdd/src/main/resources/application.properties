# Supply database access through environment variables or an external configuration file.
spring.datasource.url=${TDD_DATABASE_URL}
spring.datasource.username=${TDD_DATABASE_USERNAME}
spring.datasource.password=${TDD_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# A read-only application pool; size is bounded for shared database access.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.read-only=true
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=580000
spring.datasource.hikari.idle-timeout=300000

server.port=1437

mybatis.typeAliasesPackage=com.bunnyxt.tdd.model
mybatis.mapperLocations=classpath:mapper/**/*.xml
mybatis.configuration.default-statement-timeout=300

server.compression.enabled=true
server.compression.mime-types=application/json
