name: Secret scan

on:
  push:
  pull_request:

jobs:
  scan-committed-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject secrets in committed sources
        run: python3 v2_spring_backend/tdd/scripts/check-secrets.py

  scan-packaged-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Package backend JAR
        working-directory: v2_spring_backend/tdd
        run: mvn -B -q clean package -DskipTests
      - name: Reject secrets in packaged JAR
        run: >-
          python3 v2_spring_backend/tdd/scripts/check-secrets.py
          --jar v2_spring_backend/tdd/target/tdd-backend.jar
